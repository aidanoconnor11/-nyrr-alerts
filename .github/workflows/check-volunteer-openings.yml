name: Check NYRR volunteer openings

on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduled queue is busiest.
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

# The workflow only needs to write state.json back to this repository.
permissions:
  contents: write

concurrency:
  group: nyrr-volunteer-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Direct pages stay monitorable when NYRR's directory uses a waiting room.
      NYRR_EVENT_URLS: >-
        https://events.nyrr.org/nyrr-team-champions-5m-volunteers,
        https://events.nyrr.org/nyrr-start-line-series-manhattan-volunteers,
        https://events.nyrr.org/nyrr-summer-speed-series-1-volunteers,
        https://events.nyrr.org/percy-sutton-harlem-5k-volunteers,
        https://events.nyrr.org/nyrr-summer-speed-series-2-volunteers,
        https://events.nyrr.org/tcs-new-york-city-marathon-training-series-12m-volunteers,
        https://events.nyrr.org/nyrr-summer-speed-series-3-volunteers,
        https://events.nyrr.org/nyrr-start-line-series-bronx-volunteers,
        https://events.nyrr.org/grete-s-great-gallop-10k-volunteers,
        https://events.nyrr.org/nyrr-summer-speed-series-4-volunteers,
        https://events.nyrr.org/nyrr-summer-speed-series-5-volunteers,
        https://events.nyrr.org/new-balance-bronx-10m-volunteers,
        https://events.nyrr.org/tcs-new-york-city-training-series-18m-volunteers,
        https://events.nyrr.org/vcp-cross-country-1-volunteers,
        https://events.nyrr.org/vcp-cross-country-2-volunteers,
        https://events.nyrr.org/nyrr-jersey-city-5k-volunteers,
        https://events.nyrr.org/rising-nyrr-fall-jamboree-volunteers,
        https://events.nyrr.org/abbott-dash-to-the-finish-line-5k-volunteers,
        https://events.nyrr.org/vcp-cross-country-3-volunteers,
        https://events.nyrr.org/race-to-deliver-4m-to-benefit-god-s-love-we-deliver-volunteers,
        https://events.nyrr.org/nyrr-ted-corbitt-15k-volunteers,
        https://events.nyrr.org/nyrr-frosty-5k-volunteers,
        https://events.nyrr.org/nyrr-midnight-run-volunteers
      NYRR_STATE_FILE: state.json
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USE_SSL: "true"
      SMTP_USERNAME: aidanoconnor274@gmail.com
      SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM: aidanoconnor274@gmail.com
      EMAIL_TO: aidanoconnor274@gmail.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check availability and send alerts
        run: python app.py

      - name: Persist availability state
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "nyrr-alerts[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update NYRR availability state"
          git push
