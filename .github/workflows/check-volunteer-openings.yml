name: Check NYRR volunteer openings

on:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduled queue is busiest.
    - cron: "7-59/10 * * * *"
  workflow_dispatch:

# The workflow only needs to write state.json back to this repository.
permissions:
  contents: write

concurrency:
  group: nyrr-volunteer-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # A repository variable can replace this with a comma-separated list.
      # Discovery remains enabled as a best-effort way to find new event pages.
      NYRR_EVENT_URLS: ${{ vars.NYRR_EVENT_URLS || 'https://events.nyrr.org/nyrr-midnight-run-volunteers' }}
      NYRR_STATE_FILE: state.json
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USE_SSL: "true"
      SMTP_USERNAME: aidanoconnor274@gmail.com
      SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM: aidanoconnor274@gmail.com
      EMAIL_TO: aidanoconnor274@gmail.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check availability and send alerts
        run: python app.py

      - name: Persist availability state
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "nyrr-alerts[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update NYRR availability state"
          git push
